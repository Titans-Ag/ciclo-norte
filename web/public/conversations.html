  <style>
    /* ═══ CRITICAL: Prevent body scroll entirely ═══ */
    html, body { height: 100%; overflow: hidden; margin: 0; }

    /* Thin scrollbar for scroll regions */
    .scroll-thin::-webkit-scrollbar { width: 5px; }
    .scroll-thin::-webkit-scrollbar-track { background: transparent; }
    .scroll-thin::-webkit-scrollbar-thumb { background: #E8E8E8; border-radius: 999px; }
    .scroll-thin::-webkit-scrollbar-thumb:hover { background: #B0B0B0; }

    /* Focus-visible ring for accessibility */
    *:focus-visible {
      outline: 2px solid #F5C518;
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* Tab content fade-in */
    .tab-content { animation: tabIn 200ms ease; }
    @keyframes tabIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Message appear */
    .msg-appear { animation: msgIn 250ms ease-out; }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Dropdown animation */
    .dropdown-menu { animation: dropIn 150ms ease; }
    @keyframes dropIn {
      from { opacity: 0; transform: translateY(-4px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Pulse for online indicator */
    .pulse-dot { animation: pulseDot 2s ease-in-out infinite; }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>

<!-- ═══════════════════════════════════════════════════════════════════
     JAVASCRIPT — State, rendering, interactions
     All client-side. No SSR. Compatible with static export.
     ═══════════════════════════════════════════════════════════════════ -->
<script>
// ── Config ──
const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:8085' : 'http://192.168.15.97:8085';
const token = localStorage.getItem('cn_token');
if (!token) { window.location.href = '/login'; }

// ── State ──
let conversations = [];
let messages = [];
let currentView = 'conversations';
let activeConversationId = null;
let mobileShowChat = false;
let activeAdminTab = 'lojas';
let activeFilter = 'todos';
let sseConnected = false;
let es = null;
let pollInterval = null;

// ── Status config ──
const statusConfig = {
  ia_ativa:    { label: 'IA Ativa',     bg: 'bg-industrial-yellow-pale',   text: 'text-industrial-yellow-dark', border: 'border-industrial-yellow/20' },
  humano:     { label: 'Humano',      bg: 'bg-industrial-blue-pale',     text: 'text-industrial-blue',       border: 'border-industrial-blue/20' },
  transferida:{ label: 'Transferida', bg: 'bg-industrial-orange-pale',  text: 'text-industrial-orange',     border: 'border-industrial-orange/20' },
  resolvida:  { label: 'Resolvida',   bg: 'bg-industrial-green-pale',    text: 'text-industrial-green',      border: 'border-industrial-green/20' },
};

const avatarColors = {
  ia_ativa: 'bg-industrial-yellow',
  humano: 'bg-industrial-blue',
  transferida: 'bg-industrial-orange',
  resolvida: 'bg-industrial-gray',
};

function getInitials(name) {
  if (!name) return '??';
  const p = name.split(' ').filter(Boolean);
  if (p.length === 1) return p[0].slice(0, 2).toUpperCase();
  return (p[0][0] + p[p.length - 1][0]).toUpperCase();
}

function timeShort(d) {
  const date = new Date(d);
  const now = new Date();
  const mins = Math.floor((now - date) / 60000);
  const hrs = Math.floor((now - date) / 3600000);
  const days = Math.floor((now - date) / 86400000);
  if (mins < 1) return 'agora';
  if (mins < 60) return mins + ' min';
  if (hrs < 24) return hrs + 'h';
  if (days < 7) return days + ' dias';
  return date.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
}

function timeAgo(d) {
  const date = new Date(d);
  const now = new Date();
  const diff = Math.floor((now - date) / 1000);
  if (diff < 60) return 'agora';
  if (diff < 3600) return Math.floor(diff / 60) + ' min atrás';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h atrás';
  if (diff < 604800) return Math.floor(diff / 86400) + ' dias atrás';
  return date.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
}

// ── API helpers ──
async function api(path, opts) {
  const url = API_BASE + path;
  const res = await fetch(url, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { 'Authorization': 'Bearer ' + token } : {}),
      ...(opts?.headers || {}),
    },
  });
  return res;
}

async function fetchConversations() {
  try {
    const res = await api('/api/conversations');
    if (!res.ok) throw new Error('Erro ao carregar conversas');
    const data = await res.json();
    conversations = data.conversations || [];
    renderConversationList();
  } catch (e) {
    const el = document.getElementById('conversation-list');
    if (el) el.innerHTML = '<div class="p-4 rounded-xl bg-industrial-red-pale border border-industrial-red/20"><p class="text-sm text-industrial-red">' + (e.message || 'Erro') + '</p></div>';
  }
}

async function fetchMessages(conversaId) {
  try {
    const res = await api('/api/conversations/' + conversaId);
    if (!res.ok) return [];
    const data = await res.json();
    return data.mensagens || [];
  } catch { return []; }
}

async function sendMessageApi() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !activeConversationId) return;
  try {
    const res = await api('/api/conversations/' + activeConversationId + '/messages', {
      method: 'POST',
      body: JSON.stringify({ conteudo: text, midia_tipo: 'text' }),
    });
    if (res.ok) {
      input.value = '';
      messages = await fetchMessages(activeConversationId);
      renderChatMessages();
    }
  } catch { /* ignore */ }
}

async function handleAction(action, body) {
  if (!activeConversationId) return;
  try {
    const res = await api('/api/conversations/' + activeConversationId + '/' + action, {
      method: 'POST',
      body: body ? JSON.stringify(body) : undefined,
    });
    if (res.ok) await fetchConversations();
  } catch { /* ignore */ }
}

// ── SSE ──
function setupSSE() {
  if (!token) return;
  if (es) { es.close(); es = null; }
  const url = API_BASE + '/api/events?token=' + encodeURIComponent(token);
  es = new EventSource(url);
  es.onopen = () => { sseConnected = true; updateSSEStatus(); if (pollInterval) { clearInterval(pollInterval); pollInterval = null; } };
  es.addEventListener('nova_mensagem', (ev) => {
    try {
      const payload = JSON.parse(ev.data);
      if (payload.conversa_id === activeConversationId) {
        messages.push(payload);
        renderChatMessages();
      }
      fetchConversations();
    } catch {}
  });
  es.addEventListener('conversa_transferida', () => fetchConversations());
  es.addEventListener('status_mudou', () => fetchConversations());
  es.addEventListener('atendente_assumiu', () => fetchConversations());
  es.onerror = () => {
    sseConnected = false;
    updateSSEStatus();
    if (es) { es.close(); es = null; }
    // fallback polling
    if (!pollInterval) {
      pollInterval = setInterval(() => {
        fetch(API_BASE + '/api/events/poll?token=' + encodeURIComponent(token))
          .then(r => r.ok ? r.json() : null)
          .then(data => { if (data?.events?.length) fetchConversations(); })
          .catch(() => {});
      }, 5000);
    }
  };
}

function updateSSEStatus() {
  const dots = document.querySelectorAll('.pulse-dot');
  const labels = document.querySelectorAll('.sse-label');
  dots.forEach(d => {
    d.classList.remove('bg-industrial-green', 'bg-industrial-red');
    d.classList.add(sseConnected ? 'bg-industrial-green' : 'bg-industrial-red');
  });
  labels.forEach(l => { l.textContent = sseConnected ? 'Online' : 'Offline'; });
}

// ── Render Conversation List ──
function renderConversationList() {
  const list = document.getElementById('conversation-list');
  if (!list) return;
  let filtered = activeFilter === 'todos' ? [...conversations] : conversations.filter(c => c.status === activeFilter);
  const q = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
  if (q) filtered = filtered.filter(c => (c.cliente_nome || '').toLowerCase().includes(q) || c.cliente_telefone.toLowerCase().includes(q) || (c.ultima_mensagem || '').toLowerCase().includes(q));
  filtered.sort((a, b) => new Date(b.ultima_msg_em) - new Date(a.ultima_msg_em));

  if (!conversations.length) {
    list.innerHTML = '<div class="flex flex-col items-center justify-center py-12"><svg class="w-6 h-6 animate-spin text-industrial-yellow" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg><p class="mt-3 text-sm text-industrial-medium">Carregando...</p></div>';
    return;
  }
  if (!filtered.length) {
    list.innerHTML = '<div class="flex flex-col items-center justify-center py-12 text-industrial-medium"><p class="text-sm">Nenhuma conversa encontrada.</p></div>';
    return;
  }

  list.innerHTML = filtered.map(conv => {
    const sc = statusConfig[conv.status] || statusConfig.ia_ativa;
    const isActive = conv.id === activeConversationId;
    const avatarBg = avatarColors[conv.status] || 'bg-industrial-gray';
    const avatarText = conv.status === 'ia_ativa' ? 'text-industrial-dark' : 'text-white';
    const unread = conv.unread_count || 0;
    return `
      <div class="group p-4 rounded-xl cursor-pointer transition-all duration-200 ${isActive ? 'bg-industrial-yellow-pale/60 shadow-industrial-md' : 'bg-industrial-white shadow-industrial-sm hover:shadow-industrial-md hover:scale-[1.01] hover:bg-white'} border border-industrial-pale/60" onclick="selectConversation('${conv.id}')">
        <div class="flex gap-3.5">
          <div class="relative flex-none">
            <div class="w-11 h-11 rounded-full ${avatarBg} flex items-center justify-center shadow-sm">
              <span class="text-[13px] font-bold ${avatarText}">${getInitials(conv.cliente_nome)}</span>
            </div>
            ${unread > 0 ? `<div class="absolute -top-0.5 -right-0.5 w-5 h-5 rounded-full bg-industrial-yellow text-industrial-dark text-[10px] font-bold flex items-center justify-center border-2 border-white shadow-sm">${unread}</div>` : ''}
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-start justify-between gap-2 mb-1">
              <h3 class="text-[14px] font-semibold text-industrial-black truncate">${conv.cliente_nome || conv.cliente_telefone}</h3>
              <span class="text-[11px] text-industrial-medium whitespace-nowrap flex-none mt-0.5">${timeShort(conv.ultima_msg_em)}</span>
            </div>
            <p class="text-[13px] text-industrial-gray line-clamp-2 leading-snug mb-2">${conv.ultima_mensagem || 'Sem mensagens'}</p>
            <div class="flex items-center gap-2">
              <span class="text-[11px] text-industrial-medium truncate">${conv.loja_nome || ''}</span>
              <span class="px-2 py-0.5 rounded-full text-[10px] font-medium ${sc.bg} ${sc.text} border ${sc.border} flex-none">${sc.label}</span>
            </div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// ── Render Chat Messages ──
function renderChatMessages() {
  const container = document.getElementById('chat-messages');
  if (!container) return;
  if (!messages.length) {
    container.innerHTML = '<div class="flex flex-col items-center justify-center py-12"><svg class="h-8 w-8 animate-spin text-industrial-yellow" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg><p class="mt-3 text-sm font-medium text-industrial-medium">Carregando mensagens...</p></div>';
    return;
  }
  container.innerHTML = messages.map(msg => {
    const isClient = msg.autor_tipo === 'cliente';
    const isAgent = msg.autor_tipo === 'ia';
    const bubbleBg = isClient ? 'bg-industrial-white border border-industrial-pale' : isAgent ? 'bg-industrial-yellow-pale border border-industrial-yellow/15' : 'bg-industrial-blue-pale border border-industrial-blue/15';
    const align = isClient ? 'mr-auto' : 'ml-auto';
    return `
      <div class="flex ${isClient ? 'justify-start' : 'justify-end'} mb-3 msg-appear">
        <div class="${align} max-w-[85%] md:max-w-[65%]">
          <div class="${bubbleBg} rounded-2xl px-4 py-3 shadow-industrial-sm">
            ${!isClient ? `<p class="text-[11px] font-semibold ${isAgent ? 'text-industrial-yellow-dark' : 'text-industrial-blue'} mb-1">${msg.autor_nome}</p>` : ''}
            <p class="text-[14px] text-industrial-black leading-relaxed whitespace-pre-line">${msg.conteudo || '(sem texto)'}</p>
          </div>
          <p class="text-[11px] text-industrial-light mt-1 ${isClient ? 'text-left' : 'text-right'}">${timeAgo(msg.enviada_em || msg.created_at)}</p>
        </div>
      </div>
    `;
  }).join('');
  container.scrollTop = container.scrollHeight;
}

// ── View Switching ──
function switchView(view) {
  currentView = view;
  const convView = document.getElementById('view-conversations');
  const admView = document.getElementById('view-admin');
  const navConv = document.getElementById('nav-conversations');
  const navAdm = document.getElementById('nav-admin');
  const mobConv = document.getElementById('mob-conversations');
  const mobAdm = document.getElementById('mob-admin');
  const app = document.getElementById('app');

  if (view === 'conversations') {
    convView.classList.remove('hidden'); convView.classList.add('flex');
    admView.classList.add('hidden'); admView.classList.remove('flex');
    if (navConv) { navConv.classList.add('text-industrial-yellow'); navConv.classList.remove('text-industrial-light'); }
    if (navAdm) { navAdm.classList.remove('text-industrial-yellow'); navAdm.classList.add('text-industrial-light'); }
    if (mobConv) { mobConv.querySelector('svg').classList.add('text-industrial-yellow'); mobConv.querySelector('svg').classList.remove('text-industrial-light'); mobConv.querySelector('span').classList.add('text-industrial-yellow'); mobConv.querySelector('span').classList.remove('text-industrial-light'); }
    if (mobAdm) { mobAdm.querySelector('svg').classList.remove('text-industrial-yellow'); mobAdm.querySelector('svg').classList.add('text-industrial-light'); mobAdm.querySelector('span').classList.remove('text-industrial-yellow'); mobAdm.querySelector('span').classList.add('text-industrial-light'); }
    mobileShowChat = false;
    app.setAttribute('data-mobile-view', 'list');
  } else {
    convView.classList.add('hidden'); convView.classList.remove('flex');
    admView.classList.remove('hidden'); admView.classList.add('flex');
    if (navConv) { navConv.classList.remove('text-industrial-yellow'); navConv.classList.add('text-industrial-light'); }
    if (navAdm) { navAdm.classList.add('text-industrial-yellow'); navAdm.classList.remove('text-industrial-light'); }
    if (mobConv) { mobConv.querySelector('svg').classList.remove('text-industrial-yellow'); mobConv.querySelector('svg').classList.add('text-industrial-light'); mobConv.querySelector('span').classList.remove('text-industrial-yellow'); mobConv.querySelector('span').classList.add('text-industrial-light'); }
    if (mobAdm) { mobAdm.querySelector('svg').classList.add('text-industrial-yellow'); mobAdm.querySelector('svg').classList.remove('text-industrial-light'); mobAdm.querySelector('span').classList.add('text-industrial-yellow'); mobAdm.querySelector('span').classList.remove('text-industrial-light'); }
  }
}

// ── Conversation Selection ──
async function selectConversation(id) {
  activeConversationId = id;
  const isMobile = window.innerWidth < 768;
  if (isMobile) {
    mobileShowChat = true;
    document.getElementById('app').setAttribute('data-mobile-view', 'chat');
  }
  renderConversationList();
  messages = await fetchMessages(id);
  renderChatMessages();
  updateChatHeader();
}

function showConversationList() {
  mobileShowChat = false;
  document.getElementById('app').setAttribute('data-mobile-view', 'list');
}

function updateChatHeader() {
  const conv = conversations.find(c => c.id === activeConversationId);
  if (!conv) return;
  const h2 = document.querySelector('#chat-panel h2');
  const phone = document.querySelector('#chat-panel p.font-mono');
  const avatar = document.querySelector('#chat-panel .w-10.h-10.rounded-full span');
  if (h2) h2.textContent = conv.cliente_nome || conv.cliente_telefone;
  if (phone) phone.textContent = conv.cliente_telefone;
  if (avatar) avatar.textContent = getInitials(conv.cliente_nome);
  const badge = document.querySelector('#chat-panel .hidden.sm\\:inline-flex');
  const sc = statusConfig[conv.status];
  if (badge && sc) badge.textContent = sc.label;
}

// ── Filter Tabs ──
function setupFilterTabs() {
  document.querySelectorAll('.filter-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      activeFilter = tab.dataset.filter;
      document.querySelectorAll('.filter-tab').forEach(t => {
        t.classList.remove('bg-industrial-yellow', 'text-industrial-black', 'active');
        t.classList.add('bg-industrial-surface', 'text-industrial-medium');
      });
      tab.classList.add('bg-industrial-yellow', 'text-industrial-black', 'active');
      tab.classList.remove('bg-industrial-surface', 'text-industrial-medium');
      renderConversationList();
    });
  });
}

// ── Admin Tabs ──
function setupAdminTabs() {
  document.querySelectorAll('.admin-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      activeAdminTab = tab.dataset.tab;
      document.querySelectorAll('.admin-tab').forEach(t => {
        t.classList.remove('active', 'border-industrial-yellow', 'text-industrial-black');
        t.classList.add('border-transparent', 'text-industrial-medium');
      });
      tab.classList.add('active', 'border-industrial-yellow', 'text-industrial-black');
      tab.classList.remove('border-transparent', 'text-industrial-medium');
    });
  });
}

// ── Dropdowns ──
function toggleDropdown(id) {
  const el = document.getElementById(id);
  const isHidden = el.classList.contains('hidden');
  closeDropdowns();
  if (isHidden) el.classList.remove('hidden');
}
function closeDropdowns() {
  document.querySelectorAll('.dropdown-menu').forEach(d => d.classList.add('hidden'));
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('.relative') || !e.target.closest('button')) closeDropdowns();
});

// ── Chat Input ──
function handleInputKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessageApi(); }
}
function refreshConversations() {
  const btn = event.currentTarget;
  const svg = btn.querySelector('svg');
  if (svg) { svg.classList.add('animate-spin'); setTimeout(() => svg.classList.remove('animate-spin'), 800); }
  fetchConversations();
}

// ── Transfer modal ──
function openTransferModal() {
  document.getElementById('transfer-modal').classList.remove('hidden');
  closeDropdowns();
}
function closeTransferModal() {
  document.getElementById('transfer-modal').classList.add('hidden');
  document.getElementById('transfer-loja').value = '';
}
async function doTransfer() {
  const loja = document.getElementById('transfer-loja').value;
  if (!loja || !activeConversationId) return;
  await handleAction('transferir', { loja_id: loja });
  closeTransferModal();
}

// ── Mobile view CSS ──
const mobileViewStyle = document.createElement('style');
mobileViewStyle.textContent = `
  @media (max-width: 767px) {
    [data-mobile-view="list"] #sidebar { display: flex !important; }
    [data-mobile-view="list"] #chat-panel { display: none !important; }
    [data-mobile-view="chat"] #sidebar { display: none !important; }
    [data-mobile-view="chat"] #chat-panel { display: flex !important; }
  }
  @media (min-width: 768px) {
    #sidebar { display: flex !important; }
    #chat-panel { display: flex !important; }
  }
  .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
`;
document.head.appendChild(mobileViewStyle);

// ── Initialize ──
async function init() {
  setupFilterTabs();
  setupAdminTabs();
  await fetchConversations();
  setupSSE();
}
document.addEventListener('DOMContentLoaded', init);
</script>
